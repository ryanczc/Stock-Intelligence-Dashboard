name: Update market data

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 5:30 PM SGT, after SGX / HKEX close
    - cron: "0 22 * * 1-5"   # 6:00 AM SGT, after US close
  workflow_dispatch:
    inputs:
      reference:
        description: "Force refresh of Damodaran datasets"
        type: boolean
        default: false

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Refresh prices, fundamentals, events and alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.run ${{ inputs.reference && '--reference' || '' }}
