name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest pipeline/tests -q
      - name: Live smoke test against Yahoo + Damodaran (informational)
        continue-on-error: true
        run: python -m pipeline.run --dry-run --symbols NOW,IREN,VST,CEG,SOFI,FPS,ATAT,GRAB,SE,MSTR,BMNR,PURR-USD,CARDS-USD,PENDLE-USD,SYRUP-USD,KNTQ-USD,AAPL,MSFT,NVDA,D05.SI,C38U.SI,0700.HK,ES3.SI,BTC-USD,ETH-USD --reference --print-json
